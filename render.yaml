services:
  - type: web
    name: knowledge-os-backend
    plan: free
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: KNOWLEDGE_OS_DATABASE_URL
        sync: false
        placeholder: "postgresql+asyncpg://user:pass@host:port/db (e.g. Supabase, Render Postgres, etc.)"
      
      - key: KNOWLEDGE_OS_JWT_SECRET
        generateValue: true
      
      - key: KNOWLEDGE_OS_CORS_ORIGINS
        value: '["http://localhost:3000", "https://your-frontend-vercel-url.vercel.app"]'
      
      - key: KNOWLEDGE_OS_ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      
      - key: KNOWLEDGE_OS_REFRESH_TOKEN_TTL_DAYS
        value: "30"
      
      - key: KNOWLEDGE_OS_SECURE_COOKIES
        value: "true"
      
      - key: KNOWLEDGE_OS_STORAGE_PROVIDER
        value: "local"  # "local", "azure_blob", or "supabase"
      
      - key: KNOWLEDGE_OS_SUPABASE_URL
        sync: false
        placeholder: "https://your-project.supabase.co"
      
      - key: KNOWLEDGE_OS_SUPABASE_S3_ENDPOINT
        sync: false
        placeholder: "https://your-project.storage.supabase.co/storage/v1/s3"
      
      - key: KNOWLEDGE_OS_SUPABASE_REGION
        value: "us-east-1"
      
      - key: KNOWLEDGE_OS_SUPABASE_KEY
        sync: false
        placeholder: "Your S3 access key ID from Supabase Storage Settings"
      
      - key: KNOWLEDGE_OS_SUPABASE_SECRET_KEY
        sync: false
        placeholder: "Your S3 secret access key from Supabase Storage Settings"
      
      - key: KNOWLEDGE_OS_SUPABASE_STORAGE_BUCKET
        value: "documents"
      
      - key: KNOWLEDGE_OS_EMBEDDING_PROVIDER
        value: "gemini" # "gemini" or "openai"
      
      - key: KNOWLEDGE_OS_GEMINI_API_KEY
        sync: false
        placeholder: "Your Gemini API Key"
      
      - key: KNOWLEDGE_OS_QDRANT_URL
        sync: false
        placeholder: "Your Qdrant instance URL (e.g. Qdrant Cloud)"
      
      - key: KNOWLEDGE_OS_QDRANT_API_KEY
        sync: false
        placeholder: "Your Qdrant instance API Key (if using Qdrant Cloud)"
      
      - key: KNOWLEDGE_OS_TEMPORAL_HOST
        value: "localhost:7233" # In production, set to your Temporal Cloud or self-hosted Temporal instance
      
      - key: KNOWLEDGE_OS_TEMPORAL_NAMESPACE
        value: "default"
      
      - key: KNOWLEDGE_OS_TEMPORAL_API_KEY
        sync: false
        placeholder: "Your Temporal Cloud API key (if using Temporal Cloud)"
      
      - key: KNOWLEDGE_OS_PROCESSING_MODE
        value: "temporal" # "temporal" or "sync" (sync requires no Temporal/worker)
